apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-defaults
  namespace: {{ include "go-capi-client.targetNamespace" . }}
  labels:
    {{- include "go-capi-client.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.clusterDefaults }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
