apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-capi-client.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "go-capi-client.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- with .Values.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "go-capi-client.selectorLabels" . | nindent 4 }}
