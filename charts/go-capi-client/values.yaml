replicaCount: 1

image:
  repository: go-capi-client
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

config:
  # Empty means the namespace in which the chart is installed.
  namespace: ""
  address: 0.0.0.0
  port: 8080
  swaggerUI: stoplight

service:
  type: ClusterIP
  port: 80
  # Fixed NodePort when type is NodePort; empty lets the cluster allocate one.
  nodePort: ""
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: go-capi-client.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 10
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /ping
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# Cluster creation defaults stored in the target namespace.
clusterDefaults:
  workerName: "md-0"
  controlPlaneEndpointPort: "6443"
  controlPlaneEndpointSubnet: "16"
  controlPlaneLoadBalancer: "kube-vip"
  podCIDR: "172.31.0.0/16"
  serviceCIDR: "192.168.0.0/16"
  serviceDomain: "cluster.local"
  cni: "cilium"
  controlPlaneMachineSpec: |
    templateID: <your-xo-template-uuid>
    poolID: <your-xo-pool-uuid>
    bootstrapProvider: kubeadm
    bootstrap:
      cloudInit: true
      kubeVIP: true
    resourceSet:
      cpus: 4
      memory: 8Gi
      diskSize: 30Gi
    networkConfig:
      networks:
        - networkID: <your-xo-network-uuid>
  workerMachineSpec: |
    templateID: <your-xo-template-uuid>
    poolID: <your-xo-pool-uuid>
    bootstrapProvider: kubeadm
    bootstrap:
      cloudInit: true
      kubeVIP: true
    resourceSet:
      cpus: 4
      memory: 8Gi
      diskSize: 30Gi
    networkConfig:
      networks:
        - networkID: <your-xo-network-uuid>
  controlPlaneKubeadmConfig: |
    clusterConfiguration:
      apiServer:
        certSANs:
        - localhost
        - 127.0.0.1
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cgroup-driver
          value: systemd
        - name: cloud-provider
          value: external
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cgroup-driver
          value: systemd
        - name: cloud-provider
          value: external
    preKubeadmCommands:
    - |
      IP=$(hostname -I | awk '{print $1}')
      hostnamectl set-hostname "cp-$(echo "$IP" | tr '.' '-')"
      echo "$IP $(hostname) $(hostname -s)" >> /etc/hosts
    - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
    - modprobe overlay; modprobe br_netfilter
    - |
      printf 'net.bridge.bridge-nf-call-iptables  = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward                 = 1\nnet.ipv4.conf.all.rp_filter         = 0\nnet.ipv4.conf.eth0.rp_filter        = 0\n' > /etc/sysctl.d/k8s.conf
    - sysctl --system
    - swapoff -a; sed -i '/ swap /d' /etc/fstab 2>/dev/null; true
    - dnf install -y epel-release
    - |
      FULL="{{KUBERNETES_VERSION}}"
      MINOR=$(echo "$FULL" | sed 's/\(v[0-9]*\.[0-9]*\).*/\1/')
      # Pin the exact requested version so KCP does not consider the node
      # out-of-date (and roll it forever) when the repo would install a
      # newer patch release.
      echo "$FULL" > /etc/kubernetes-version
      cat <<EOF > /etc/yum.repos.d/kubernetes.repo
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/repodata/repomd.xml.key
      EOF
    - |
      VERSION=$(sed 's/^v//' /etc/kubernetes-version)
      dnf install -y --disableexcludes=kubernetes --setopt=install_weak_deps=False containerd runc "kubelet-$VERSION" "kubeadm-$VERSION" "kubectl-$VERSION"
    - |
      containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | tee /etc/containerd/config.toml
      sed -i "s|config_path = ''|config_path = '/etc/containerd/certs.d'|" /etc/containerd/config.toml
    - mkdir -p /etc/containerd/certs.d/registry.k8s.io && printf 'server = "https://registry.k8s.io"\n\n[host."https://mirror.gcr.io"]\n  capabilities
      = ["pull", "resolve"]\n' > /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    - systemctl enable --now containerd
    - systemctl enable --now kubelet
  workerKubeadmConfig: |
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cgroup-driver
          value: systemd
        - name: cloud-provider
          value: external
    preKubeadmCommands:
    - |
      IP=$(hostname -I | awk '{print $1}')
      hostnamectl set-hostname "worker-$(echo "$IP" | tr '.' '-')"
      echo "$IP $(hostname) $(hostname -s)" >> /etc/hosts
    - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
    - modprobe overlay; modprobe br_netfilter
    - |
      printf 'net.bridge.bridge-nf-call-iptables  = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward                 = 1\nnet.ipv4.conf.all.rp_filter         = 0\nnet.ipv4.conf.eth0.rp_filter        = 0\n' > /etc/sysctl.d/k8s.conf
    - sysctl --system
    - swapoff -a; sed -i '/ swap /d' /etc/fstab 2>/dev/null; true
    - dnf install -y epel-release
    - |
      FULL="{{KUBERNETES_VERSION}}"
      MINOR=$(echo "$FULL" | sed 's/\(v[0-9]*\.[0-9]*\).*/\1/')
      # Pin the exact requested version so KCP does not consider the node
      # out-of-date (and roll it forever) when the repo would install a
      # newer patch release.
      echo "$FULL" > /etc/kubernetes-version
      cat <<EOF > /etc/yum.repos.d/kubernetes.repo
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/repodata/repomd.xml.key
      EOF
    - |
      VERSION=$(sed 's/^v//' /etc/kubernetes-version)
      dnf install -y --disableexcludes=kubernetes --setopt=install_weak_deps=False containerd runc "kubelet-$VERSION" "kubeadm-$VERSION"
    - |
      containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | tee /etc/containerd/config.toml
      sed -i "s|config_path = ''|config_path = '/etc/containerd/certs.d'|" /etc/containerd/config.toml
    - mkdir -p /etc/containerd/certs.d/registry.k8s.io && printf 'server = "https://registry.k8s.io"\n\n[host."https://mirror.gcr.io"]\n  capabilities
      = ["pull", "resolve"]\n' > /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    - systemctl enable --now containerd
    - systemctl enable --now kubelet
    - arping -I eth0 -c 3 {{CONTROL_PLANE_IP}} 2>/dev/null || true
