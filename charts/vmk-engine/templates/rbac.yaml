{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "vmk-engine.fullname" . }}
  namespace: {{ include "vmk-engine.targetNamespace" . }}
  labels:
    {{- include "vmk-engine.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machinedeployments"]
    verbs: ["create", "get", "list", "patch"]
  - apiGroups: ["vates.infrastructure.cluster.x-k8s.io"]
    resources: ["xoclusters", "xomachinetemplates"]
    verbs: ["create"]
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["kubeadmcontrolplanes"]
    verbs: ["create", "get", "patch"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["kubeadmconfigtemplates"]
    verbs: ["create", "get"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "vmk-engine.fullname" . }}
  namespace: {{ include "vmk-engine.targetNamespace" . }}
  labels:
    {{- include "vmk-engine.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vmk-engine.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "vmk-engine.fullname" . }}
{{- end }}
