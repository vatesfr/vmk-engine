apiVersion: v1
kind: ServiceAccount
metadata:
  name: go-capi-client
  labels:
    app.kubernetes.io/name: go-capi-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: go-capi-client
  labels:
    app.kubernetes.io/name: go-capi-client
rules:
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["machinedeployments"]
    verbs: ["create", "get", "list", "patch"]
  - apiGroups: ["vates.infrastructure.cluster.x-k8s.io"]
    resources: ["xoclusters", "xomachinetemplates"]
    verbs: ["create"]
  - apiGroups: ["controlplane.cluster.x-k8s.io"]
    resources: ["kubeadmcontrolplanes"]
    verbs: ["create", "get", "patch"]
  - apiGroups: ["bootstrap.cluster.x-k8s.io"]
    resources: ["kubeadmconfigtemplates"]
    verbs: ["create"]
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - clusters
    verbs:
      - get
      - list
      - create
      - delete
      - patch
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machines
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - ""
    resources:
      - secrets
      - configmaps
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: go-capi-client
  labels:
    app.kubernetes.io/name: go-capi-client
subjects:
  - kind: ServiceAccount
    name: go-capi-client
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: go-capi-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-capi-client
  labels:
    app.kubernetes.io/name: go-capi-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-capi-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-capi-client
    spec:
      serviceAccountName: go-capi-client
      containers:
        - name: go-capi-client
          image: go-capi-client:latest
          imagePullPolicy: Never
          args:
            - --kube-client=in-cluster
            - --address=0.0.0.0
            - --port=8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: go-capi-client
  labels:
    app.kubernetes.io/name: go-capi-client
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: go-capi-client
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-defaults
  labels:
    app.kubernetes.io/name: go-capi-client
data:
  workerName: "md-0"
  controlPlaneEndpointPort: "6443"
  controlPlaneEndpointSubnet: "16"
  controlPlaneLoadBalancer: "kube-vip"
  podCIDR: "172.31.0.0/16"
  serviceCIDR: "192.168.0.0/16"
  serviceDomain: "cluster.local"
  cni: "cilium"
  controlPlaneMachineSpec: |
    templateID: <your-xo-template-uuid>
    poolID: <your-xo-pool-uuid>
    bootstrapProvider: kubeadm
    bootstrap:
      cloudInit: true
      kubeVIP: true
    resourceSet:
      cpus: 4
      memory: 8Gi
      diskSize: 30Gi
    networkConfig:
      networks:
        - networkID: <your-xo-network-uuid>
  workerMachineSpec: |
    templateID: <your-xo-template-uuid>
    poolID: <your-xo-pool-uuid>
    bootstrapProvider: kubeadm
    bootstrap:
      cloudInit: true
      kubeVIP: true
    resourceSet:
      cpus: 4
      memory: 8Gi
      diskSize: 30Gi
    networkConfig:
      networks:
        - networkID: <your-xo-network-uuid>
  controlPlaneKubeadmConfig: |
    clusterConfiguration:
      apiServer:
        certSANs:
        - localhost
        - 127.0.0.1
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cgroup-driver
          value: systemd
        - name: cloud-provider
          value: external
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cgroup-driver
          value: systemd
        - name: cloud-provider
          value: external
    preKubeadmCommands:
    - |
      IP=$(hostname -I | awk '{print $1}')
      hostnamectl set-hostname "cp-$(echo "$IP" | tr '.' '-')"
      echo "$IP $(hostname) $(hostname -s)" >> /etc/hosts
    - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
    - modprobe overlay; modprobe br_netfilter
    - |
      printf 'net.bridge.bridge-nf-call-iptables  = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward                 = 1\nnet.ipv4.conf.all.rp_filter         = 0\nnet.ipv4.conf.eth0.rp_filter        = 0\n' > /etc/sysctl.d/k8s.conf
    - sysctl --system
    - swapoff -a; sed -i '/ swap /d' /etc/fstab 2>/dev/null; true
    - dnf install -y epel-release
    - |
      FULL="{{KUBERNETES_VERSION}}"
      MINOR=$(echo "$FULL" | sed 's/\(v[0-9]*\.[0-9]*\).*/\1/')
      # Pin the exact requested version so KCP does not consider the node
      # out-of-date (and roll it forever) when the repo would install a
      # newer patch release.
      echo "$FULL" > /etc/kubernetes-version
      cat <<EOF > /etc/yum.repos.d/kubernetes.repo
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/repodata/repomd.xml.key
      EOF
    - |
      VERSION=$(sed 's/^v//' /etc/kubernetes-version)
      dnf install -y --disableexcludes=kubernetes --setopt=install_weak_deps=False containerd runc "kubelet-$VERSION" "kubeadm-$VERSION" "kubectl-$VERSION"
    - |
      containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | tee /etc/containerd/config.toml
      sed -i "s|config_path = ''|config_path = '/etc/containerd/certs.d'|" /etc/containerd/config.toml
    - mkdir -p /etc/containerd/certs.d/registry.k8s.io && printf 'server = "https://registry.k8s.io"\n\n[host."https://mirror.gcr.io"]\n  capabilities
      = ["pull", "resolve"]\n' > /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    - systemctl enable --now containerd
    - systemctl enable --now kubelet
  workerKubeadmConfig: |
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
        - name: cgroup-driver
          value: systemd
        - name: cloud-provider
          value: external
    preKubeadmCommands:
    - |
      IP=$(hostname -I | awk '{print $1}')
      hostnamectl set-hostname "worker-$(echo "$IP" | tr '.' '-')"
      echo "$IP $(hostname) $(hostname -s)" >> /etc/hosts
    - printf 'overlay\nbr_netfilter\n' > /etc/modules-load.d/k8s.conf
    - modprobe overlay; modprobe br_netfilter
    - |
      printf 'net.bridge.bridge-nf-call-iptables  = 1\nnet.bridge.bridge-nf-call-ip6tables = 1\nnet.ipv4.ip_forward                 = 1\nnet.ipv4.conf.all.rp_filter         = 0\nnet.ipv4.conf.eth0.rp_filter        = 0\n' > /etc/sysctl.d/k8s.conf
    - sysctl --system
    - swapoff -a; sed -i '/ swap /d' /etc/fstab 2>/dev/null; true
    - dnf install -y epel-release
    - |
      FULL="{{KUBERNETES_VERSION}}"
      MINOR=$(echo "$FULL" | sed 's/\(v[0-9]*\.[0-9]*\).*/\1/')
      # Pin the exact requested version so KCP does not consider the node
      # out-of-date (and roll it forever) when the repo would install a
      # newer patch release.
      echo "$FULL" > /etc/kubernetes-version
      cat <<EOF > /etc/yum.repos.d/kubernetes.repo
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/
      enabled=1
      gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/$MINOR/rpm/repodata/repomd.xml.key
      EOF
    - |
      VERSION=$(sed 's/^v//' /etc/kubernetes-version)
      dnf install -y --disableexcludes=kubernetes --setopt=install_weak_deps=False containerd runc "kubelet-$VERSION" "kubeadm-$VERSION"
    - |
      containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | tee /etc/containerd/config.toml
      sed -i "s|config_path = ''|config_path = '/etc/containerd/certs.d'|" /etc/containerd/config.toml
    - mkdir -p /etc/containerd/certs.d/registry.k8s.io && printf 'server = "https://registry.k8s.io"\n\n[host."https://mirror.gcr.io"]\n  capabilities
      = ["pull", "resolve"]\n' > /etc/containerd/certs.d/registry.k8s.io/hosts.toml
    - systemctl enable --now containerd
    - systemctl enable --now kubelet
    - arping -I eth0 -c 3 {{CONTROL_PLANE_IP}} 2>/dev/null || true
